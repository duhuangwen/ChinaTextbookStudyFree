name: Android APK
on:
  push:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/install-web-data.py'
      - 'scripts/apply-content-errata.py'
      - 'scripts/content-errata.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/install-web-data.py'
      - 'scripts/apply-content-errata.py'
      - 'scripts/content-errata.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v*-tv tag to rebuild and attach the APK to'
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && endsWith(github.ref_name, '-tv') && github.ref_name) || '' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Web dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Install complete course data
        working-directory: .
        run: python3 scripts/install-web-data.py
      - name: Build self-contained Web bundle
        working-directory: apps/web
        run: npx next build
      - name: Test, lint and build installable debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: china-textbook-study-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to the tag's pre-release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle | tr -d '\r')
          apk="ChinaTextbookStudyFree-AndroidTV-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" | awk '{print toupper($1) "  " $2}' > "$apk.sha256"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "聪聪学堂 Android TV ${version}" --notes "APK 使用 debug 签名，适合侧载安装。"
          gh release upload "$RELEASE_TAG" "$apk" "$apk.sha256" --clobber
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-check-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
