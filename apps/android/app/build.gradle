plugins { id 'com.android.application' }

def remoteWebAppUrl = providers.gradleProperty('webAppUrl').orNull
def embeddedWeb = remoteWebAppUrl == null
def webAppUrl = embeddedWeb ? 'https://appassets.androidplatform.net/' : remoteWebAppUrl
def parsedUrl = new URI(webAppUrl)
if (parsedUrl.scheme != 'https' || !parsedUrl.host || parsedUrl.userInfo || parsedUrl.query || parsedUrl.fragment) {
    throw new GradleException('webAppUrl must be an HTTPS URL without credentials, query or fragment')
}
android {
    namespace 'org.chinatextbook.study'
    compileSdk 35
    defaultConfig {
        applicationId 'org.chinatextbook.study'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
        buildConfigField 'String', 'WEB_APP_URL', '"' + webAppUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'EMBEDDED_WEB', embeddedWeb ? 'true' : 'false'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
}

def embeddedWebDir = rootProject.file('../web/out')
tasks.register('prepareEmbeddedWeb', Sync) {
    doFirst {
        if (!embeddedWebDir.isDirectory()) {
            throw new GradleException('Missing apps/web/out. Build the Web export before the APK.')
        }
    }
    from(embeddedWebDir) {
        exclude '_next/**'
    }
    from(new File(embeddedWebDir, '_next')) {
        into 'next-static'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}
tasks.named('preBuild').configure { dependsOn 'prepareEmbeddedWeb' }
